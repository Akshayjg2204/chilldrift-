<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Drift — 3D Browser Racing Game</title>
    <meta name="description" content="High-octane browser-based 3D drifting game featuring the legendary AE86. Built with Three.js (WebGL) and Vite for realistic physics, dynamic lighting, and smooth 60 FPS gameplay.">
    <meta name="author" content="Akshay Gaikwad (Streamline.dev)">
    <meta name="keywords" content="Three.js, WebGL, 3D Game, Racing Game, AE86, Car Drift, Browser Game, Vite, JavaScript">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chill-drift.netlify.app/">
    <meta property="og:title" content="Chill Drift — 3D Browser Racing Game">
    <meta property="og:description" content="High-octane browser-based 3D drifting game featuring the legendary AE86. Built with Three.js and Vite for smooth 60 FPS drift physics.">
    <meta property="og:image" content="/preview.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Chill Drift — 3D Browser Racing Game">
    <meta name="twitter:description" content="High-octane browser-based 3D drifting game featuring the legendary AE86. Built with Three.js and Vite for smooth 60 FPS drift physics.">
    <meta name="twitter:image" content="/preview.png">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-container {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            z-index: 20;
        }
        #speed-meter {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        #controls {
            font-size: 14px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 1.5;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-container">
        <div id="speed-meter">Speed: 0 km/h</div>
        <div id="controls">
            <b>🎮 Controls:</b><br>
            <b>W / ↑</b> — Accelerate<br>
            <b>S / ↓</b> — Brake / Reverse<br>
            <b>A / ←</b> — Steer Left<br>
            <b>D / →</b> — Steer Right<br>
            <b>SPACE</b> — Handbrake (Drift)
        </div>
    </div>
    <div id="speedometer" style="
        position: absolute;
        top: 24px;
        right: 24px;
        color: #fff;
        font-size: 1.8em;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(6px);
        padding: 0.4em 0.9em;
        border-radius: 0.5em;
        border: 1px solid rgba(255,255,255,0.1);
        z-index: 10;
        pointer-events: none;
        letter-spacing: 0.05em;
        display: none;
    ">
        0 km/h
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
