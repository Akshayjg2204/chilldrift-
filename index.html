<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Drift - 3D Car Drifting Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-container {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #speed-meter {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #controls {
            font-size: 16px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-container">
        <div id="speed-meter">Speed: 0 km/h</div>
        <div id="controls">
            Controls:<br>
            W/↑ - Accelerate<br>
            S/↓ - Brake/Reverse<br>
            A/← - Turn Left<br>
            D/→ - Turn Right<br>
            SPACE - Handbrake
        </div>
    </div>
    <div id="speedometer" style="
        position: absolute;
        top: 24px;
        left: 24px;
        color: #fff;
        font-size: 2em;
        font-family: monospace;
        background: rgba(0,0,0,0.4);
        padding: 0.3em 0.8em;
        border-radius: 0.4em;
        z-index: 10;
        pointer-events: none;
        letter-spacing: 0.05em;
    ">
        0 km/h
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
